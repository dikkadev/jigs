[project]
name = "my-jig"
version = "0.1.0"
description = "AI-scriptable jig for [DOMAIN]"
requires-python = ">=3.12"
dependencies = [
    # Add domain-specific dependencies here
    # "httpx>=0.27",
    # "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_jig"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
